<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{top :: top}"></head>

<body>
<div class="container">

    <div th:replace="~{header :: header}"></div>



    <h2>Horario</h2>
    <div>
        <form class="form-horizontal" th:object="${entity}" th:action="@{/horarios}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="col-sm-2 control-label">Descripción (ej. 08:00)</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{descrip}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Meridiano (AM / PM)</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{meridiano}"/>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="@{/horarios}">Cancelar</a>
            </div>
            <h5 style="color:red;" th:text="${message}"></h5>
        </form>
    </div>



</div>
</body>
</html>
