<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{top :: top}"></head>

<body style="background-color: #f5f5f5;">

<div class="container">
    <div class="row" style="margin-top: 100px;">
        <div class="col-md-4 col-md-offset-4">

            <div class="panel panel-primary" style="box-shadow: 0 4px 8px rgba(0,0,0,0.15); border-radius: 6px;">
                <div class="panel-heading text-center">
                    <h3 class="panel-title" style="font-size: 20px; padding: 5px 0;">Gestión de Turnos</h3>
                </div>
                <div class="panel-body" style="padding: 30px;">


                    <div class="alert alert-danger" th:if="${param.error}">
                        <span class="glyphicon glyphicon-exclamation-sign"></span> Usuario o contraseña incorrectos.
                    </div>
                    <div class="alert alert-info" th:if="${param.logout}">
                        Usted ha salido del sistema correctamente.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-group">
                            <label>Usuario</label>
                            <div class="input-group">
                                <span class="input-group-addon"><span class="glyphicon glyphicon-user"></span></span>
                                <input type="text" class="form-control" name="username" placeholder="Ingrese su usuario" autofocus="autofocus" required/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-addon"><span class="glyphicon glyphicon-lock"></span></span>
                                <input type="password" class="form-control" name="password" placeholder="Ingrese su contraseña" required/>
                            </div>
                        </div>

                        <div style="margin-top: 25px;">
                            <button type="submit" class="btn btn-primary btn-block btn-lg">Ingresar</button>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-center text-muted"><small>Sistema de Gestión de Clínica</small></p>

        </div>
    </div>
</div>
</body>
</html>
