<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{top :: top}"></head>

<body>
<div class="container">

    <div th:replace="~{header :: header}"></div>



    <h2>Paciente</h2>
    <div>
        <form class="form-horizontal" th:object="${entity}" th:action="@{/pacientes}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="col-sm-2 control-label">Apellido</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{apellido}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Nombre</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{nombre}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Tipo Documento</label>
                <div class="col-sm-10">
                    <select class="form-control" name="tipodoc">
                        <option th:each="o : ${tiposdocs}"
                                th:value="${o.id}"
                                th:text="${o.descrip}"
                                th:selected="${entity.tipodoc != null and entity.tipodoc.id == o.id}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Nro. Documento</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{dni}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Dirección</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{direccion}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Email</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{email}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Teléfono</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{telefono}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Observación</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{observacion}"/>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="@{/pacientes}">Cancelar</a>
            </div>
            <h5 style="color:red;" th:text="${message}"></h5>
        </form>
    </div>



</div>
</body>
</html>
