<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{top :: top}"></head>

<body>
<div class="container">

    <div th:replace="~{header :: header}"></div>


    <h2>Cambiar contraseña</h2>

    <div class="row">
        <div class="col-sm-6">
            <form th:action="@{/password}" method="post">
                <div class="form-group">
                    <label>Contraseña actual</label>
                    <input type="password" class="form-control" name="actual" autocomplete="current-password"/>
                </div>
                <div class="form-group">
                    <label>Nueva contraseña</label>
                    <input type="password" class="form-control" name="nueva" autocomplete="new-password"/>
                    <span class="help-block">Mínimo 6 caracteres.</span>
                </div>
                <div class="form-group">
                    <label>Confirmar nueva contraseña</label>
                    <input type="password" class="form-control" name="confirmar" autocomplete="new-password"/>
                </div>
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="@{/}">Cancelar</a>
                <h5 style="color:red;" th:text="${message}"></h5>
                <h5 style="color:green;" th:text="${ok}"></h5>
            </form>
        </div>
    </div>


</div>
</body>
</html>
