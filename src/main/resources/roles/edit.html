<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{top :: top}"></head>

<body>
<div class="container">

    <div th:replace="~{header :: header}"></div>



    <h2>Rol</h2>
    <div>
        <form class="form-horizontal" th:object="${entity}" th:action="@{/roles}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="col-sm-2 control-label">Descripción</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{descrip}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Nivel de acceso</label>
                <div class="col-sm-10">
                    <input type="number" class="form-control" th:field="*{nivelacceso}"/>
                    <span class="help-block">1 = Administrador (gestiona todo), 2 = Profesional (consulta su agenda).</span>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="@{/roles}">Cancelar</a>
            </div>
            <h5 style="color:red;" th:text="${message}"></h5>
        </form>
    </div>



</div>
</body>
</html>
