<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{top :: top}"></head>

<body style="background-color: #f5f5f5;">

<div class="container">

    <div class="row" style="margin-top: 100px;">
        <div class="col-md-6 col-md-offset-3">

            <div class="panel panel-danger text-center" style="box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px;">
                <div class="panel-heading">
                    <h3 class="panel-title">Error del Sistema</h3>
                </div>
                <div class="panel-body" style="padding: 40px;">


                    <h1 style="font-size: 80px; color: #d9534f; margin-top: 0; font-weight: bold;" th:text="${status}">500</h1>

                    <h3 style="margin-bottom: 20px;">Ocurrió un problema</h3>

                    <!-- Mensajes específicos según el error -->
                    <div class="alert alert-warning" th:if="${status == 403}">
                        No tiene permiso para acceder a esta página.
                    </div>
                    <div class="alert alert-info" th:if="${status == 404}">
                        La página solicitada no existe.
                    </div>
                    <div class="alert alert-danger" th:if="${status != 403 and status != 404}">
                        No se pudo completar la operación.
                    </div>

                    <!-- Detalle técnico -->
                    <p class="text-muted">
                        <small>Código: <span th:text="${status}"></span> - <span th:text="${error}"></span></small>
                    </p>

                    <hr/>

                    <a class="btn btn-primary btn-lg" th:href="@{/}" style="margin-top: 10px;">
                        <span class="glyphicon glyphicon-home"></span> Volver al Inicio
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
