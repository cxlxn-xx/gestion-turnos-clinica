<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="top">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>


    <script th:src="@{/jquery-3.3.1.min.js}"></script>
    <script th:src="@{/bootstrap.min.js}"></script>
    <link th:href="@{/bootstrap.min.css}" rel="stylesheet" media="screen"/>

    <title>Gestión de Turnos</title>

    <script>
        function confirmAction(a, mensaje) {
            if (confirm(mensaje)) {
                window.location.href = a.getAttribute('data-url');
            }
            return false;
        }
        function confirmDelete(a) {
            return confirmAction(a, '¿Seguro para eliminar el registro?');
        }
    </script>
</head>

</body>
</html>
