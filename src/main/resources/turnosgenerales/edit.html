<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{top :: top}"></head>

<body>
<div class="container">

    <div th:replace="~{header :: header}"></div>



    <h2>Turno General</h2>
    <div>
        <form class="form-horizontal" th:object="${entity}" th:action="@{/turnosgenerales}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="col-sm-2 control-label">Día</label>
                <div class="col-sm-10">
                    <select class="form-control" name="dia">
                        <option th:each="o : ${dias}"
                                th:value="${o.id}"
                                th:text="${o.descrip}"
                                th:selected="${entity.dia != null and entity.dia.id == o.id}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Horario</label>
                <div class="col-sm-10">
                    <select class="form-control" name="horario">
                        <option th:each="o : ${horarios}"
                                th:value="${o.id}"
                                th:text="${o.descrip + ' ' + o.meridiano}"
                                th:selected="${entity.horario != null and entity.horario.id == o.id}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label"></label>
                <div class="col-sm-10">
                    <input type="checkbox" th:field="*{estado}"/>
                    Turno Activo
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="@{/turnosgenerales}">Cancelar</a>
            </div>
            <h5 style="color:red;" th:text="${message}"></h5>
        </form>
    </div>



</div>
</body>
</html>
