<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{top :: top}"></head>

<body>
<div class="container">

    <div th:replace="~{header :: header}"></div>



    <h2>Usuario</h2>
    <div>
        <form class="form-horizontal" th:object="${entity}" th:action="@{/usuarios}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="col-sm-2 control-label">Usuario</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{usuario}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Contraseña</label>
                <div class="col-sm-10">
                    <input type="password" class="form-control" name="contrasenia" autocomplete="new-password"/>
                    <span class="help-block">Al editar, dejar vacío para no cambiar la contraseña.</span>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Descripción</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{descrip}"/>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">Rol</label>
                <div class="col-sm-10">
                    <select class="form-control" name="rol">
                        <option th:each="o : ${roles}"
                                th:value="${o.id}"
                                th:text="${o.descrip}"
                                th:selected="${entity.rol != null and entity.rol.id == o.id}"></option>
                    </select>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="@{/usuarios}">Cancelar</a>
            </div>
            <h5 style="color:red;" th:text="${message}"></h5>
        </form>
    </div>


</div>
</body>
</html>
